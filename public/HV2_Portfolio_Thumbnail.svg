<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Heritage Vault 2.0 resilient Linux infrastructure</title>
  <desc id="desc">Portfolio cover showing layered infrastructure architecture for edge, Linux applications, data, resilience, security, and automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07192c"/><stop offset="1" stop-color="#123d66"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d89a32"/><stop offset="1" stop-color="#f2c66e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020914" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="100" r="260" fill="#1677e8" opacity=".12"/>
  <circle cx="120" cy="820" r="300" fill="#d89a32" opacity=".09"/>
  <g transform="translate(115 105)">
    <text x="0" y="0" fill="#f2c66e" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">INFRASTRUCTURE ARCHITECTURE · CASE STUDY</text>
    <text x="0" y="105" fill="#ffffff" font-family="Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-4">Heritage Vault 2.0</text>
    <text x="0" y="163" fill="#9ecbff" font-family="Arial, sans-serif" font-size="34">Resilient Linux Infrastructure</text>
    <text x="0" y="230" fill="#c8d9ea" font-family="Arial, sans-serif" font-size="24">Secure · Scalable · Recoverable · Repeatable</text>
  </g>
  <g transform="translate(115 440)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="190" rx="22" fill="#ffffff" opacity=".98"/>
    <rect x="278" y="0" width="250" height="190" rx="22" fill="#ffffff" opacity=".98"/>
    <rect x="556" y="0" width="250" height="190" rx="22" fill="#ffffff" opacity=".98"/>
    <rect x="834" y="0" width="250" height="190" rx="22" fill="#ffffff" opacity=".98"/>
    <rect x="1112" y="0" width="250" height="190" rx="22" fill="#ffffff" opacity=".98"/>
    <g font-family="Arial, sans-serif">
      <text x="28" y="44" fill="#1677e8" font-size="18" font-weight="700" letter-spacing="2">EDGE &amp; ACCESS</text><text x="28" y="86" fill="#10243a" font-size="25" font-weight="700">DNS · CDN · WAF</text><text x="28" y="122" fill="#607187" font-size="18">TLS · traffic control</text><rect x="28" y="146" width="92" height="7" rx="4" fill="url(#gold)"/>
      <text x="306" y="44" fill="#1677e8" font-size="18" font-weight="700" letter-spacing="2">APPLICATION</text><text x="306" y="86" fill="#10243a" font-size="25" font-weight="700">Linux web / API</text><text x="306" y="122" fill="#607187" font-size="18">Load balancing · scale</text><rect x="306" y="146" width="92" height="7" rx="4" fill="url(#gold)"/>
      <text x="584" y="44" fill="#1677e8" font-size="18" font-weight="700" letter-spacing="2">DATA</text><text x="584" y="86" fill="#10243a" font-size="25" font-weight="700">PostgreSQL</text><text x="584" y="122" fill="#607187" font-size="18">Object storage · search</text><rect x="584" y="146" width="92" height="7" rx="4" fill="url(#gold)"/>
      <text x="862" y="44" fill="#1677e8" font-size="18" font-weight="700" letter-spacing="2">RESILIENCE</text><text x="862" y="86" fill="#10243a" font-size="25" font-weight="700">Replication · DR</text><text x="862" y="122" fill="#607187" font-size="18">Snapshots · restore tests</text><rect x="862" y="146" width="92" height="7" rx="4" fill="url(#gold)"/>
      <text x="1140" y="44" fill="#1677e8" font-size="18" font-weight="700" letter-spacing="2">OPERATIONS</text><text x="1140" y="86" fill="#10243a" font-size="25" font-weight="700">Ansible · Git</text><text x="1140" y="122" fill="#607187" font-size="18">CI/CD · monitoring</text><rect x="1140" y="146" width="92" height="7" rx="4" fill="url(#gold)"/>
    </g>
  </g>
  <g transform="translate(115 730)" font-family="Arial, sans-serif">
    <text x="0" y="0" fill="#f2c66e" font-size="22" font-weight="700">EDWARD WONDER MORDEY</text>
    <text x="0" y="38" fill="#b9ccde" font-size="20">Linux · Systems Administration · High Availability · Security · Automation</text>
  </g>
